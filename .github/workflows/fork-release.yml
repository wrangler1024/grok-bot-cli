name: Samforo GitHub Release

on:
  push:
    tags: ['v*-samforo.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Samforo version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: samforo-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'wrangler1024/grok-bot-cli'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci

      - name: Check source and committed artifact
        run: npm run check

      - name: Pack the tagged fork
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          mkdir release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS

      - name: Smoke-test the packaged executable
        run: |
          install_root=$(mktemp -d)
          npm install --global --prefix "$install_root" ./release-assets/*.tgz
          "$install_root/bin/gbot" --version
          "$install_root/bin/gbot" --help
          "$install_root/bin/gbot-install" --help

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --notes-file docs/releases/samforo.md
          fi
